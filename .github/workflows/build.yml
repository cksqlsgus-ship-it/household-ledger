name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: signing-key
          key: permanent-android-signing-key-v1

      - name: Set up permanent signing key
        run: |
          mkdir -p signing-key ~/.android
          if [ -f release-key.jks ]; then
            cp release-key.jks signing-key/release-key.jks
          elif [ -f signing-key/release-key.jks ]; then
            cp signing-key/release-key.jks release-key.jks
          else
            keytool -genkeypair -v \
              -keystore signing-key/release-key.jks \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp signing-key/release-key.jks release-key.jks
          fi

          if ! git ls-files --error-unmatch release-key.jks >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release-key.jks
            git commit -m "Save permanent signing key" || true
            git push || true
          fi

          cp signing-key/release-key.jks ~/.android/debug.keystore

      - name: Prepare Android project structure
        run: |
          mkdir -p app/src/main/java/com/myledger/app
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt app/src/main/java/com/myledger/app/MainActivity.kt
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoLedger"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.myledger.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.myledger.app"
                  minSdk 26
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "3.${{ github.run_number }}"
              }

              signingConfigs {
                  debug {
                      storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  resources {
                      excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/NOTICE', 'META-INF/LICENSE']
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'com.sun.mail:android-mail:1.6.7'
              implementation 'com.sun.mail:android-activation:1.6.7'
              implementation 'org.jsoup:jsoup:1.17.2'
          }
          EOF

      - name: Build Debug APK
        run: |
          if [ ! -f app/src/main/AndroidManifest.xml ] || [ ! -f app/src/main/java/com/myledger/app/MainActivity.kt ]; then
            echo "Waiting for AndroidManifest.xml and MainActivity.kt..."
            exit 0
          fi
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug

      - name: Upload APK
        if: hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: auto-ledger-apk
          path: app/build/outputs/apk/debug/app-debug.apk
concurrency:
